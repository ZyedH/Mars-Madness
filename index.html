<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ece4;--panel:#fffaf4;--ink:#2a1d16;--mute:#7a6558;--line:#e0d2c4;--ok:#1d8f6e;--warn:#c27a10;--bad:#c9382a;--btn:#2a1d16;--btnink:#fffaf4;

:root[data-theme="dark"]{--bg:#17110e;--panel:#241b16;--ink:#f1e5d6;--mute:#a8917f;--line:#3a2c24;--ok:#5fd0a8;--warn:#f2a93b;--bad:#ff6b57;--btn:#f1e5d6;--btnink:#17110e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "IBM Plex Sans",system-ui,sans-serif}

button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px;min-height:44px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--warn);outline-offset:2px}

.ts{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:14px}
.ts h1{font:700 clamp(52px,17vw,100px)/.95 "Chakra Petch",sans-serif;margin:0;letter-spacing:-2px}
.ts>p{font-size:19px;color:var(--mute);margin:0;max-width:30ch}
.planet{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8955f,#b0472b 58%,#5b2314)}
.modes{display:grid;gap:8px;width:100%;max-width:420px}
.mode{text-align:left;padding:12px 14px}.mode b{display:block;font:700 18px "Chakra Petch",sans-serif}.mode span{color:var(--mute);font-size:14px}
.mode[aria-pressed=true]{background:var(--btn);color:var(--btnink)}.mode[aria-pressed=true] span{color:inherit;opacity:.8}
.setup{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}

.srow button{min-width:44px}.srow button[aria-pressed=true]{background:var(--btn);color:var(--btnink)}
.ts .setup p{font-size:14px;max-width:none;margin:0;color:var(--mute)}
#startBtn,#contBtn{max-width:420px}

.start{display:flex;align-items:center;gap:6px;min-height:34px;padding:4px 8px;margin-bottom:6px;background:var(--panel);border:1px dashed var(--line);border-radius:10px;font:700 14px "Chakra Petch",sans-serif}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:640px}
.cell{aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;display:flex;flex-wrap:wrap;align-content:flex-end;gap:2px;position:relative}
.cell i{position:absolute;top:3px;left:5px;font:600 11px "IBM Plex Sans",sans-serif;font-style:normal;color:var(--mute)}
.tok{width:20px;height:20px;border-radius:50%;color:#fff;font:700 12px/20px "Chakra Petch",sans-serif;text-align:center;box-shadow:0 0 0 2px var(--panel)}.tok.on{box-shadow:0 0 0 2px var(--ink)}
#board{margin-bottom:12px}
.manual{display:flex;gap:8px;margin-bottom:12px}.dice{flex-wrap:wrap;align-items:center}.dice .dl{font-weight:600;width:100%}.dice input{max-width:90px}.dice button[aria-pressed=true]{background:var(--btn);color:var(--btnink)}.manual input{flex:1;min-width:0;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}

.card{border:3px solid var(--c);border-radius:16px;background:var(--panel);overflow:hidden;max-width:380px;margin:0 0 12px}
.ctop{background:var(--c);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 14px}.cn{font:700 20px "Chakra Petch",sans-serif}.ci{font-size:46px;line-height:1}
.art{display:block;width:100%;height:auto;background:#0b1020;border-bottom:3px solid var(--c)}.card .fact{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:14px;color:var(--mute)}.card .gain{margin-top:8px;font-weight:600;color:var(--ok)}
.cb{padding:12px 14px}.cb h3{margin:0 0 6px;font-size:20px;color:var(--c)}.cb p{margin:0}
.lesson{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.lesson h3{margin:0 0 4px;font-size:16px}.lesson p{margin:0}
.choice{display:block;width:100%;text-align:left;margin-top:8px;font-weight:600}.choice small{display:block;color:var(--mute);font-weight:500;margin-top:2px}.outcome{margin-top:12px;padding:10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.piles{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0}.piles summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
#pbody{display:flex;gap:12px;align-items:flex-start;margin-top:8px}
.pile{text-align:center;font-size:13px;color:var(--mute)}.back{width:64px;height:92px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:var(--bg);font:700 11px "Chakra Petch",sans-serif;letter-spacing:1px;margin-bottom:4px}
.disc{display:flex;flex-wrap:wrap;gap:6px;color:var(--mute);font-size:14px}
.mini{width:42px;height:60px;border-radius:6px;border:2px solid var(--c);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px;font-size:11px}.mini b{background:var(--c);color:#fff;width:100%;text-align:center;border-radius:3px}.mini span{font-size:20px}

.ovr h2{font-size:20px;margin:14px 0 2px}.ovr p{margin:0 0 10px;color:var(--mute);font-size:14px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.team{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:12px;padding:12px}.team.act{outline:2px solid var(--tc)}.team.out{opacity:.6}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.th h2{margin:0;font-size:20px;color:var(--tc)}.th span{font-size:13px;color:var(--mute)}
.track{height:6px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden}.track i{display:block;height:100%;background:var(--tc)}
.rr{margin-bottom:10px}.rl{display:flex;justify-content:space-between;font-size:15px}
.bar{height:10px;background:var(--line);border-radius:5px;margin:4px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}.low .bar i{background:var(--bad)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.steps button{padding:4px;min-height:34px;font-weight:600}
.warn{font-weight:600;color:var(--bad);font-size:13px}
.reset{margin-top:16px;width:100%;color:var(--mute)}
.nasa{margin-top:12px;padding:10px 12px;border-left:4px solid var(--ok);background:var(--bg);border-radius:6px}.nasa h3{margin:0 0 4px;font-size:15px}.nasa p{margin:0 0 4px}.nasa small{color:var(--mute)}.nasa img{max-width:100%;border-radius:8px;margin-top:6px}
.end{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.endbox{background:var(--panel);color:var(--ink);border-radius:16px;padding:20px;max-width:440px;width:100%}.endbox h2{margin:0 0 10px;font-size:28px;line-height:1.1}
.endbox ul{list-style:none;padding:0;margin:0 0 16px}.endbox li{border-left:5px solid var(--tc);padding:6px 10px;margin-bottom:6px;background:var(--bg);border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section class="ts" id="titlescreen">
  <div class="planet" aria-hidden="true"></div><h1>Mars Madness</h1>
  <p>Thirty days on Mars. Every decision costs something.</p>
  <div class="modes" id="modes"></div><div id="setup" style="width:100%"></div>
  <button class="primary" id="startBtn" disabled>Start mission</button>
  <button id="contBtn" style="display:none;width:100%">Continue mission</button>
</section>
<div id="play" style="display:none">
  <header><div><h1 id="modelbl">Mars Madness</h1><div class="day"><span id="dayn">0</span><small> / 30</small></div></div><div class="num" id="whose"></div></header>
  <div class="die"><div class="dief" id="dief" aria-live="polite">⚀</div><div><button class="primary" id="rollBtn">Roll the die</button><div id="pos"></div></div></div>
  <div class="manual dice" id="diceIn" style="display:none"><span class="dl">Your own dice</span><button id="dn1" aria-pressed="true">1 die</button><button id="dn2" aria-pressed="false">2 dice</button><input id="d1" type="number" inputmode="numeric" min="1" max="6" placeholder="Die 1" aria-label="Die 1 number"><input id="d2" type="number" inputmode="numeric" min="1" max="6" placeholder="Die 2" aria-label="Die 2 number" style="display:none"><button id="useDie">Use my roll</button></div>
  <div id="board"></div>
  <div class="manual" id="entry"><input id="code" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" placeholder="Card (e.g. 12, Q2, G5, B10)" aria-label="Card number"><button id="goBtn">Show scenario</button><button id="qrBtn" aria-label="Scan a card QR code">Scan QR</button></div>
  <div id="scan" style="display:none" class="scan"><video id="vid" playsinline muted></video><p id="scanmsg" aria-live="polite"></p><div class="srow"><button id="scanStop">Close scanner</button><label class="filebtn">Scan from photo<input type="file" id="qrFile" accept="image/*" capture="environment" hidden></label></div></div>
  <div class="status"><b id="stitle"></b><span id="smsg"></span></div>
  <div id="card"></div>
  <details class="piles" id="allcards" style="display:none"><summary id="acsum">All cards</summary><div id="acbody"></div></details>
  <details class="piles" id="piles"><summary id="psum"></summary><div id="pbody"></div></details>
  <div class="ovr"><h2>Manual override: Resource settings</h2><p id="ovrnote"></p></div>
  <div class="teams" id="teams"></div>
  <button class="reset" id="resetBtn">New mission</button>
</div>
</main>
<div class="end" id="end" role="dialog" aria-modal="true" aria-label="Mission result"><div class="endbox" id="endbox"></div></div>
<script>
const CARDS=[

"ALL SYSTEMS NORMAL",

const id=n=>"CARD"+String(n+1).padStart(2,"0");
const ix=n=>n<=18?n-1:n<=22?18:n-4;
const LESSON=[
"NASA’s OSDR archive collects space biology experiments, because living in space changes bodies and routines in ways teams must understand. Small stresses add up in a closed habitat. When you decide, protect the team before you try to win the argument.",
"NASA’s OSDR archive holds many studies on how low gravity affects muscle and bone, and exercise is how crews push back. When you decide, protect health routines even on busy days.",
"NASA’s EPIC camera photographs the whole sunlit Earth from deep space, a view of home that crews share with each other. When you decide, keep the crew connected and let people talk about how they feel.",
"InSight’s weather reports were counted in sols, Mars days that run about 40 minutes longer than Earth days, so crews on Mars shift their sleep to match. Tired people make mistakes. When you decide, rest before risky jobs.",
"InSight’s weather station measured Mars air pressure, a tiny fraction of Earth’s, so a leaking habitat loses air toward the thin outside. Crews find the source, isolate the section and watch the pressure. When you decide, protect the air first.",
"NASA’s InSight data shows how thin the Martian air is, which is why every habitat depends on its own oxygen. Crews rehearse emergencies until the steps are automatic. When you decide, get people to safety first and equipment second.",
"NASA’s OSDR archive includes experiments on how plants and microbes behave in spaceflight, and mold spreads quickly in closed habitats. When you decide, act early and never rely on a single food source.",
"OSDR holds space plant-growth experiments aimed at feeding future crews, but missions still plan food with a safety margin. When you decide, ration early and evenly instead of waiting until supplies are gone.",
"InSight’s weather station recorded Martian air temperatures far below freezing, so heaters and water lines need protection. When you decide, protect your water first, thaw carefully, then conserve.",
"InSight measured Martian wind, which lifts fine dust that settles on gear and clogs filters. When you decide, small cleaning habits prevent bigger health and equipment problems.",
"NASA’s DONKI database lists every instrument that detected each space-weather event, because a reading is trusted when several instruments agree. When you decide, check more than one source before you fix.",
"InSight’s mission ended in December 2022 when the lander ran out of power, and before that it cut back measurements to stretch what it had. When you decide, keep life support running and switch off the extras.",
"NASA’s NeoWs service tracks near-Earth asteroids and flags the ones that are potentially hazardous, which gives time to prepare. When you decide, inspect first, seal second and repair third.",
"NeoWs flags potentially hazardous objects so people can prepare, but a warning only helps if the alarms work. When you decide, fix safety equipment first and never skip a safety check.",
"InSight recorded air temperatures changing by tens of degrees Celsius within a single Martian day, so crews plan outdoor work around the weather. When you decide, wait out dangerous cold and avoid unnecessary risks.",
"NASA’s DONKI database logs solar flares and geomagnetic storms, which can disrupt radio links, so a crew may have to act alone. When you decide, rely on your training and checklist, then report afterward.",
"DONKI shows how one solar flare can be followed by a coronal mass ejection, a shock and a storm days later, while messages between Mars and Earth already take minutes. When you decide, send clear, complete messages and keep working.",
"NASA’s DONKI database tracks solar flares, and spacecraft face strong sunlight on one side and deep shade on the other, so thermal systems manage the swings. When you decide, protect people first and handle heat and cold together.",
"NASA’s Astronomy Picture of the Day is a daily reminder that calm days are for looking up and preparing. Crews use quiet time to inspect, maintain, rest and train. Use calm days to recover and prepare for the next problem.",
"Space-weather records in NASA’s DONKI database help planners pick calmer times for risky operations like landings. A resupply is a gift, not a plan. When you decide, restock what keeps the crew alive first.",
"InSight ran on solar panels, and its power limits shaped how often it could measure Mars weather. A good power day is a chance to catch up. When you decide, rebuild reserves before you spend them.",
"NASA’s OSDR archive includes plant-growth experiments, because fresh food supports health and morale on long missions. When you decide, share some of a good harvest now and save some for later.",
"NASA’s Astronomy Picture of the Day and EPIC views of Earth remind crews of home. Good news lifts morale, but the boost fades. When you decide, use good days to build resilience.",
"NASA’s Mars Trek mapping service lets scientists study Mars terrain, and finding water ice is a top priority for future crews. When you decide, think about what you will need most later, not only today.",
"NASA’s DONKI database tracks the space weather that can disturb radio links, so a clear link is worth using well. When you decide, spend a good connection on what you can only get from Earth.",
"NASA publishes open APIs so anyone can build tools from real mission data, and shared tools make crews and engineers better at their jobs. When you decide, put an upgrade where the crew is weakest.",
"DONKI logs solar flares, and when the Sun is quiet crews can plan outdoor work with less worry about radiation. When you decide, use quiet-Sun days for work that is dangerous in a storm."];

const DESC=[
"Weeks into the mission, small habits are starting to grate. Tools get left out, someone is always loud, and tempers are short in the cramped habitat.",
"Low gravity is making everyone feel weaker. The exercise gear is ready, but the repair list is long and there is little spare time.",
"The crew is lonely. Everyone misses family, friends and open skies, and the days all feel the same inside the habitat walls.",
"The habitat is noisy, the lights stay on, and a Martian day runs a little longer than an Earth day. Crew members are lying awake and getting tired.",
"An alarm sounds. Air pressure in one module is slowly dropping, and a faint hiss is coming from somewhere near the wall.",
"The oxygen alarm blares as levels fall fast. The crew has only minutes to act before breathing gets difficult.",
"White fuzzy mold is spreading across the vegetable crop. If it keeps going, the garden that feeds the crew could be lost.",
"A count of the pantry shows less food than planned. The next supply ship is months away, so the crew must decide how to stretch what is left.",
"A freezing night has frozen part of the water line, and water has stopped flowing into the habitat tanks.",
"Red dust is on everything and there is no shower. Dirty filters and surfaces have the crew worried about germs.",
"A key system crashes and the control panel fills with error codes. Nobody is sure what is wrong, and the crew has to decide how to fix it.",
"The solar panels are producing less power than expected, and the batteries are draining faster than planned.",
"A loud bang echoes through the habitat. A small meteorite has hit the outer wall, and the crew does not know how far the damage goes.",
"During a routine check the crew finds a dead alarm and a cracked helmet visor. The gear meant to keep them safe cannot be trusted.",
"A bitter cold snap hits the surface. The habitat heaters struggle, and going outside is dangerous.",
"An emergency strikes and the crew calls Mission Control. There is no reply, and every minute counts.",
"A message to Earth takes many minutes each way. The crew needs advice now, but there can be no real conversation.",
"In flight, the sunlit side of the ship is overheating while the shaded side freezes, and some systems start acting strangely.",
"A quiet day. Every system reads normal and nothing needs urgent attention. It is a chance to catch your breath.",
"A cargo lander from Earth touches down near the habitat. The crew has time to unpack one crate first.",
"The dust clears and the solar panels are producing more power than planned. The crew can decide how to use the surplus.",
"The greenhouse produces a bigger harvest than anyone expected. The crew can decide how to use it.",
"Mission Control sends a message full of good news and notes from family and friends. Morale soars.",
"A rover scan finds a patch of buried ice close to the habitat.",
"The Earth link is clear and strong, so the crew can talk live with Mission Control.",
"A software update from Earth makes the recycling and power systems more efficient.",
"Forecasters report a very quiet Sun, so the crew can plan outdoor work with little radiation worry."];

function lessonHTML(n){return '<div class="lesson"><h3>NASA life lesson</h3><p>'+LESSON[ix(n)]+'</p></div>'}
const CHOICES=[
[["Hold a crew meeting and rebalance chores",{"crew":10,"safety":-5}],["Ignore it and keep working",{"safety":5,"crew":-10}],["Set up separate quiet hours",{"crew":5,"power":-5}]],
[["Do the full exercise routine",{"crew":10,"food":-5}],["Skip exercise to finish repairs",{"safety":5,"crew":-10}],["Do a short workout and keep repairing",{"crew":5,"safety":-5}]],
[["Use power for a video call to Earth",{"crew":10,"power":-10}],["Save power and stay quiet",{"power":5,"crew":-10}],["Hold a crew movie night",{"crew":5,"power":-5}]],
[["Enforce a full rest shift",{"crew":10,"safety":-5}],["Work through the night",{"safety":10,"crew":-10}],["Sleep in two shifts so someone is always on watch",{"safety":5,"crew":-5}]],
[["Patch the leak now with emergency sealant",{"oxygen":10,"power":-10}],["Seal off the module and abandon it",{"safety":5,"oxygen":-10}],["Plug it with spare supplies and watch the pressure",{"oxygen":5,"safety":-5}]],

const PC=[{"c":"1","w":"M","k":"H","t":"Living With the Same People","d":"Your crew has been living together for months. Everyone is getting annoyed, and arguments are starting.","ch":[["Have a video call with family.",{"crew":10,"power":-5}],["Ignore everyone.",{"crew":-10,"safety":-5}],["Tell your teammates what's bothering you.",{"crew":15,"safety":10}]]},{"c":"2","w":"M","k":"H","t":"Staying in Shape","d":"Your muscles are getting weaker because you haven't exercised enough during your space mission.","ch":[["Use a special exercise bike.",{"crew":10,"power":-5}],["Run on a treadmill with a harness.",{"crew":15,"power":-10}],["Use a resistance exercise machine.",{"crew":15,"power":-5}]]},{"c":"3","w":"M","k":"H","t":"Missing Society and Freedom","d":"Your crew misses friends, family, nature, and the freedom to explore.","ch":[["Organize a virtual-reality gathering with family and friends.",{"crew":15,"power":-10}],["Spend time in a miniature indoor park with plants and nature sounds.",{"crew":10,"water":-5}],["Enjoy a supervised recreational activity in the habitat.",{"crew":10,"safety":5}]]},{"c":"4","w":"M","k":"H","t":"Sleep Problems","d":"Your crew isn't sleeping well because the spacecraft has no natural Earth-like day-and-night cycle. Tired astronauts are making mistakes.","core":1,"ch":[["Follow a regular sleep schedule.",{"crew":15,"safety":5}],["Adjust the lights to create an artificial nighttime.",{"crew":10,"power":-10}],["Keep working without enough sleep.",{"crew":-15,"safety":-10}]]},{"c":"5","w":"R","k":"O","t":"Habitat Air Leak","d":"Your Mars habitat is leaking air! Pressure and oxygen supplies are dropping.","core":1,"ch":[["Patch the leak.",{"power":-10,"oxygen":-5,"safety":15}],["Evacuate to the emergency habitat.",{"oxygen":-10,"crew":-5,"safety":20}],["Leave it alone.",{"oxygen":-25,"crew":-10,"safety":-20}]]},{"c":"6","w":"R","k":"O","t":"No Air!","d":"The oxygen supply in your habitat is dangerously low. The crew needs breathable air immediately!","ch":[["Activate backup oxygen.",{"oxygen":20,"safety":10}],["Repair the oxygen generator.",{"power":-15,"oxygen":15,"safety":5}],["Wait for help from Earth.",{"oxygen":-25,"crew":-20,"safety":-20}]]},{"c":"7","w":"R","k":"F","t":"Fungus on the Plants","d":"Strange fungus is spreading through the Mars greenhouse. Your food supply could be in danger.","core":1,"ch":[["Remove the affected plants and regrow the food.",{"food":-15,"water":-10,"safety":10}],["Eat the affected plants anyway.",{"food":10,"crew":-20,"safety":-10}],["Go sob about it.",{"crew":-10,"food":-20}]]},{"c":"8","w":"R","k":"F","t":"Running Out of Food","d":"Your food supplies are running low, and the greenhouse won't produce another harvest for several days.","ch":[["Ration everyone's meals.",{"food":10,"crew":-10}],["Use extra power and water to grow more food.",{"power":-15,"water":-15,"food":20}],["Continue eating normally.",{"food":-25,"safety":-10}]]},{"c":"9","w":"M","k":"F","t":"Food Limitations","d":"Your crew is tired of eating the same specially prepared foods. Some meals are difficult to handle in microgravity, and food variety is limited.","ch":[["Plan balanced meals using available food.",{"food":-10,"crew":10}],["Experiment with new meals using extra supplies.",{"food":-15,"crew":15,"power":-5}],["Skip meals you don't like.",{"food":5,"crew":-15}]]},{"c":"10","w":"R","k":"W","t":"Frozen Water Pipe","d":"A water pipe has frozen! Your crew needs water to drink, cook, and grow food.","ch":[["Use heat to warm it up.",{"power":-15,"water":10,"safety":5}],["Replace the pipe.",{"power":-10,"water":-5,"safety":10}],["Keep using it and hope everything will be okay.",{"water":-15,"safety":-15}]]},{"c":"11","w":"M","k":"W","t":"Keeping Clean","d":"Your crew needs to stay clean, but water and hygiene supplies are limited.","ch":[["Use specialized cleaning wipes.",{"crew":5,"water":10}],["Take sponge baths.",{"water":-10,"crew":10}],["Use no-rinse soap.",{"crew":5,"water":5}]]},{"c":"12","w":"M","k":"W","t":"Water Management","d":"Your spacecraft's water recycling system isn't recovering enough water. The crew must conserve supplies.","core":1,"ch":[["Repair the recycling system.",{"power":-15,"water":15,"safety":5}],["Reduce water consumption.",{"water":10,"crew":-5}],["Use emergency water reserves.",{"water":15,"safety":-10}]]},{"c":"13","w":"M","k":"P","t":"Technical Difficulties","d":"Something important has broken in your spacecraft! The crew needs to repair it before the problem gets worse.","ch":[["Go outside and fix it.",{"oxygen":-10,"safety":-10,"power":15}],["Make a special replacement part.",{"power":-15,"safety":15}],["Switch to backup battery power and repair it.",{"power":-20,"safety":20}]]},{"c":"14","w":"R","k":"P","t":"Limited Resources","d":"Your Mars base is using supplies faster than expected. You must find a way to make them last longer.","ch":[["Ration supplies carefully.",{"food":10,"water":10,"crew":-5}],["Recycle and reuse as much as possible.",{"power":-10,"water":15,"safety":5}],["Keep using resources normally.",{"food":-15,"water":-15,"power":-10}]]},{"c":"15","w":"R","k":"P","t":"Power Problems","d":"Martian dust is covering the solar panels, and the base batteries are running low.","core":1,"ch":[["Send astronauts outside to clean the panels.",{"power":20,"oxygen":-5,"safety":-10}],["Switch to backup batteries.",{"power":15,"safety":-5}],["Turn off nonessential equipment.",{"power":10,"crew":-5}]]},{"c":"16","w":"R","k":"S","t":"Meteorite Damage","d":"A small meteorite hits your Mars base and damages important equipment.","core":1,"ch":[["Fix the damage.",{"power":-15,"safety":15,"oxygen":-5}],["Do nothing about it.",{"safety":-25,"power":-15}],["Ask Earth what to do.",{"safety":-10,"power":-5}]]},{"c":"17","w":"R","k":"S","t":"Broken Hazardous Equipment","d":"Dangerous equipment in your Mars base has broken! It could injure the crew or damage the habitat.","ch":[["Shut down and isolate the broken equipment.",{"power":-10,"safety":20}],["Put on protective gear and repair it.",{"power":-15,"crew":-5,"safety":15}],["Ignore the problem and continue working.",{"crew":-15,"safety":-25,"power":-10}]]},{"c":"18","w":"R","k":"S","t":"Extreme Temperatures on Mars","d":"The temperature outside the habitat is dangerously low. Your crew has an important outdoor mission.","ch":[["Bring extra protective spacesuit equipment.",{"power":-10,"safety":15}],["Explore outside but return when your thermometer gives a warning.",{"oxygen":-10,"crew":-5,"safety":-5}],["Stay inside until conditions improve.",{"crew":-5,"safety":10}]]},{"c":"19","w":"R","k":"S","t":"Earth Doesn't Answer in an Emergency","d":"Something has gone wrong at your Mars base! You contact Mission Control, but Earth isn't answering.","ch":[["Try to fix the emergency yourself.",{"power":-10,"safety":10,"crew":-5}],["Wait patiently for Earth to answer.",{"safety":-15,"crew":-10}],["Activate emergency mode.",{"power":-15,"safety":20,"crew":5}]]},{"c":"20","w":"R","k":"S","t":"Communication Delays","d":"Your crew needs advice from Earth, but radio messages take several minutes to travel between Mars and Earth.","ch":[["Follow your training and make a team decision.",{"crew":5,"safety":10}],["Pause important work until Earth replies.",{"power":-10,"crew":-5}],["Let one astronaut make the decision alone.",{"crew":-10,"safety":-10}]]},{"c":"21","w":"R","k":"S","t":"Navigation Problems","d":"Your rover's navigation computer has stopped working during a mission. You need to find the safest route back to base.","ch":[["Use backup navigation instruments.",{"power":-10,"safety":15}],["Follow your previous route carefully.",{"oxygen":-10,"safety":-5}],["Guess the shortest route home.",{"oxygen":-15,"safety":-20,"crew":-10}]]},{"c":"22","w":"M","k":"S","t":"Extreme Temperatures in Space","d":"During the journey to Mars, the spacecraft's temperature-control system reports a problem. Sensitive equipment may overheat or become too cold.","ch":[["Repair the temperature-control system.",{"power":-15,"safety":15}],["Use backup temperature-control equipment.",{"power":-20,"safety":10}],["Ignore the warning.",{"safety":-25,"crew":-10}]]},{"c":"Q1","w":"R","k":"Q","t":"A Normal Sol","d":"The crew finishes their checklists, eats dinner together, and watches the sky. Nothing goes wrong today.","f":"Mars fact: A Sol (one Mars day) lasts about 24 hours and 39 minutes, a little longer than a day on Earth."},{"c":"Q2","w":"R","k":"Q","t":"Two Moons Tonight","d":"The night is calm. The crew spots both of Mars' moons crossing the sky.","f":"Mars fact: Mars has two small, potato-shaped moons named Phobos and Deimos."},{"c":"Q3","w":"R","k":"Q","t":"Scenic Rover Drive","d":"A routine rover drive goes perfectly. The crew takes photos of distant mountains.","f":"Mars fact: Olympus Mons on Mars is the tallest volcano in the solar system, about 2.5 times as tall as Mount Everest."},{"c":"Q4","w":"R","k":"Q","t":"Blue Sunset","d":"Work is done for the day. The crew gathers at the window to watch the Sun go down.","f":"Mars fact: On Mars, the sky is dusty orange in the daytime, but sunsets glow blue."},{"c":"G1","w":"R","k":"G","t":"Supply Drop Arrives","d":"A cargo capsule from Earth parachutes down right next to the base, packed with fresh supplies.","g":{"food":15,"water":10}},{"c":"G2","w":"R","k":"G","t":"Bumper Harvest","d":"The greenhouse plants grew faster than expected. It's a big harvest!","g":{"food":20}},{"c":"G3","w":"R","k":"G","t":"Dust Devil Cleanup","d":"A swirling Martian dust devil blows across the base and sweeps the dust right off the solar panels.","g":{"power":20},"f":"Real space science: This really happened! Wind gusts cleaned the solar panels of NASA's Spirit and Opportunity rovers."},{"c":"G4","w":"R","k":"G","t":"Ice Discovered","d":"The rover crew finds a patch of water ice just under the soil near the base.","g":{"water":20}},{"c":"G5","w":"R","k":"G","t":"Message From Home","d":"A video message arrives from family and friends on Earth. Everyone is smiling.","g":{"crew":15}},{"c":"G6","w":"R","k":"G","t":"Oxygen Upgrade","d":"The engineers tune the oxygen generator so it makes more breathable air from the Martian atmosphere.","g":{"oxygen":20},"f":"Real space science: NASA's MOXIE experiment on the Perseverance rover made oxygen from Mars' carbon dioxide air."},{"c":"G7","w":"R","k":"G","t":"Robot Helper","d":"A repair robot finishes inspecting the base and fixes several small problems before they get worse.","g":{"safety":15,"power":5}},{"c":"G8","w":"R","k":"G","t":"Crew Celebration","d":"It's a crew member's birthday! The team shares a special meal and plays games.","g":{"crew":10,"safety":5}},{"c":"B1","w":"R","k":"B","t":"Global Dust Storm","d":"A huge dust storm blocks out the Sun for days. The solar panels can barely make power.","ch":[["Turn off everything except life support.",{"power":-5,"crew":-5}],["Go outside to wipe the panels during the storm.",{"power":5,"oxygen":-10,"safety":-15}],["Keep using power like normal.",{"power":-25,"safety":-10}]],"f":"Real space science: Martian dust storms can grow big enough to cover the whole planet."},{"c":"B2","w":"M","k":"B","t":"Solar Flare","d":"A burst of radiation from the Sun hits the spacecraft. The crew must hide in the shielded shelter.","ch":[["Hide in the shielded shelter right away.",{"crew":-5,"safety":10}],["Finish your work first, then hide.",{"crew":-10,"safety":-5}],["Ignore the warning.",{"crew":-20,"safety":-15}]]},{"c":"B3","w":"R","k":"B","t":"Marsquake","d":"The ground shakes! A marsquake rattles the base and loosens some equipment.","ch":[["Inspect the base and tighten loose equipment.",{"power":-10,"safety":15}],["Move everyone to the strongest module.",{"crew":-5,"safety":10}],["Keep working like nothing happened.",{"safety":-20,"power":-10}]],"f":"Real space science: NASA's InSight lander recorded more than 1,300 marsquakes."},{"c":"B4","w":"R","k":"B","t":"Dust in the Airlock","d":"Fine red dust sneaks into the airlock and clogs the air filters.","ch":[["Clean the air filters right away.",{"oxygen":10,"power":-5}],["Swap in your spare filters.",{"oxygen":15,"safety":-5}],["Leave the dust where it is.",{"oxygen":-15,"crew":-10}]]},{"c":"B5","w":"M","k":"B","t":"Clogged Water Filter","d":"The water recycler's filter clogs up, and some water is lost before the crew can clean it.","ch":[["Take the filter apart and clean it.",{"water":10,"power":-10}],["Switch to the backup filter.",{"water":5,"safety":-5}],["Drink the water anyway.",{"water":5,"crew":-20}]]},{"c":"B6","w":"R","k":"B","t":"Grow Lights Go Dark","d":"The greenhouse grow lights burn out, and the plants stop growing for a while.","ch":[["Replace the lights with spare bulbs.",{"power":-10,"food":10}],["Move the plants next to the windows.",{"food":5,"safety":-5}],["Leave the plants in the dark.",{"food":-20}]]},{"c":"B7","w":"M","k":"B","t":"Spoiled Food","d":"A storage bin's seal broke. Some of the packaged food has gone bad and must be thrown out.","ch":[["Throw out the bad food and check the other bins.",{"food":-10,"safety":10}],["Fix the seal and save what you can.",{"food":-5,"power":-5}],["Eat it before it gets worse.",{"food":5,"crew":-20}]]},{"c":"B8","w":"R","k":"B","t":"Rover Stuck in Sand","d":"The rover's wheels sink into soft sand. The crew spends hours digging it out.","ch":[["Dig the wheels out carefully.",{"oxygen":-10,"safety":5}],["Send a second rover to tow it.",{"power":-15,"safety":10}],["Spin the wheels at full power.",{"power":-15,"safety":-15}]],"f":"Real space science: NASA's Spirit rover really got stuck in soft soil on Mars in 2009."},{"c":"B9","w":"R","k":"B","t":"Battery Overheats","d":"One of the base batteries gets too hot and has to be switched off.","ch":[["Shut it off and let it cool down.",{"power":-10,"safety":10}],["Turn on extra cooling fans.",{"power":-15,"safety":15}],["Keep using the hot battery.",{"power":5,"safety":-25}]]},{"c":"B10","w":"M","k":"B","t":"Tiny Space Rock","d":"A speck of space dust zips into the spacecraft's hull and chips the outer shield.","ch":[["Do a spacewalk to patch the shield.",{"oxygen":-10,"safety":15}],["Use the robot arm to inspect it.",{"power":-10,"safety":10}],["Ignore the chip.",{"safety":-20}]]},{"c":"B11","w":"M","k":"B","t":"Crew Cold","d":"A crew member catches a cold, and everyone feels tired and grumpy.","ch":[["Let the sick crew member rest alone.",{"crew":10,"safety":-5}],["Everyone wears masks and washes hands.",{"crew":5,"water":-5}],["Keep working together like normal.",{"crew":-15}]]},{"c":"B12","w":"M","k":"B","t":"Computer Crash","d":"The main computer freezes and has to restart. Some systems go offline until it reboots.","ch":[["Switch to the backup computer.",{"power":-10,"safety":10}],["Restart it and fly by hand meanwhile.",{"crew":-5,"safety":5}],["Keep restarting and hope it works.",{"safety":-15,"power":-10}]]},{"c":"B13","w":"R","k":"B","t":"Cold Snap","d":"An extra-cold night freezes the base. The heaters run nonstop to keep everyone warm.","ch":[["Gather the crew in one heated module.",{"power":-5,"crew":-5}],["Run every heater at full blast.",{"power":-20,"crew":5}],["Turn the heaters down to save power.",{"water":-15,"crew":-10}]],"f":"Real space science: Nights on Mars can get colder than −70 °C (−94 °F)."},{"c":"B14","w":"R","k":"B","t":"Sun Blocks the Signal","d":"Earth moves behind the Sun, and radio messages can't get through. The crew is on its own.","ch":[["Follow the plan made before the blackout.",{"safety":10,"crew":-5}],["Hold daily crew meetings and decide together.",{"crew":10,"safety":5}],["Keep trying to send messages.",{"power":-15,"crew":-5}]],"f":"Real space science: About every two years, the Sun sits between Earth and Mars and blocks radio signals for around two weeks."},{"c":"B15","w":"R","k":"B","t":"Leaky Water Tank","d":"A crack in a water tank drips for hours before anyone notices.","ch":[["Patch the crack and recycle the spill.",{"water":10,"power":-5}],["Move the water to a spare tank.",{"water":5,"power":-10}],["Just put a bucket under it.",{"water":-15}]]},{"c":"B16","w":"M","k":"B","t":"Lost Tool","d":"During a spacewalk, an important tool slips away and floats off into space.","ch":[["Use a spare tool.",{"safety":5,"power":-5}],["Make a new tool with the 3D printer.",{"power":-10,"safety":10}],["Chase the tool through space.",{"oxygen":-10,"safety":-20}]],"f":"Real space science: Astronauts really have lost tools on spacewalks. In 2008, a whole tool bag floated away from the Space Station."},{"c":"B17","w":"M","k":"B","t":"Noisy Night","d":"A rattling fan keeps the whole crew awake all night.","ch":[["Fix the rattling fan.",{"crew":10,"power":-5}],["Wear earplugs to bed.",{"crew":5,"safety":-5}],["Turn the fan off completely.",{"crew":10,"oxygen":-10,"safety":-10}]]},{"c":"B18","w":"R","k":"B","t":"Oxygen Sensor Glitch","d":"A broken sensor gives a false alarm, and the crew vents good air while checking for a leak.","ch":[["Double-check with a second sensor.",{"power":-5,"safety":10}],["Replace the broken sensor.",{"power":-10,"oxygen":5,"safety":5}],["Turn off the alarm.",{"oxygen":-15,"safety":-15}]]}];
const MAPN=["1","2","3","4","5","6","7","8","10","11","13","15","16","17","18","19","20","22","Q1","Q2","Q3","Q4","G1","G3","G2","G5","G4","G8","G6","G7"];
const PH=()=>S.mode==="phys";
const PCOL={H:"#d6456b",O:"#1b8fb8",F:"#2a9d3a",W:"#2f6fd6",P:"#b8860b",S:"#d9701a",Q:"#4f7ba3",G:"#1f9a68",B:"#cc3347"};
const PICO={H:"❤️",O:"💨",F:"🌿",W:"💧",P:"⚡",S:"🛡️",Q:"🌙",G:"🌟",B:"⚠️"};
const PKIND={H:"Health",O:"Oxygen",F:"Food",W:"Water",P:"Power",S:"Safety",Q:"Quiet day",G:"Good news",B:"Bad news"};
const pcode=c=>/^\d/.test(c.c)?"#"+c.c.padStart(2,"0"):c.c;
function pcardHTML(n){
  const c=PC[n-1],col=PCOL[c.k];
  return '<div class="card" style="--c:'+col+'"><div class="ctop"><span class="cn">Card '+pcode(c)+' · '+(c.w==="M"?"En route to Mars":"On Mars")+'</span><span class="ci" aria-hidden="true">'+PICO[c.k]+'</span></div>'+
   '<img class="art" src="'+PIC[c.c]+'" alt="'+esc(c.t)+' illustration"><div class="cb"><h3>'+esc(c.t)+'</h3><p><b>'+PKIND[c.k]+(c.core?' · ★ Core challenge':'')+'.</b> '+esc(c.d)+'</p>'+
   (c.g?'<p class="gain">Gain: '+fx(c.g)+'</p>':c.k==="Q"?'<p class="gain">No changes today.</p>':'')+
   (c.f?'<p class="fact">★ '+esc(c.f)+'</p>':'')+'</div></div>';
}
function pminiHTML(n){const c=PC[n-1];return '<div class="mini" style="--c:'+PCOL[c.k]+'" title="'+esc(c.t)+'"><b>'+c.c+'</b><span>'+PICO[c.k]+'</span></div>'}
function parseCode(raw){
  const L=/[?&#](?:c|card)=([A-Za-z0-9]+)/.exec(String(raw||""));if(L)raw=L[1];
  const s=String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");let m=/([QGB])(\d{1,2})$/.exec(s),code="";
  if(m)code=m[1]+(+m[2]);else{m=/(\d{1,2})$/.exec(s);if(m)code=String(+m[1])}
  return PC.findIndex(c=>c.c===code)+1;
}
function cardHTML(n){if(PH())return pcardHTML(n);const [e,c]=ico(n),pc=MAPN[n-1];return '<div class="card" style="--c:'+c+'"><div class="ctop"><span class="cn">Card '+n+(n>=23?' · Good news':isQ(n)?' · Quiet day':'')+'</span><span class="ci" aria-hidden="true">'+e+'</span></div>'+(PIC[pc]?'<img class="art" src="'+PIC[pc]+'" alt="'+esc(CARDS[n-1])+' illustration">':'')+'<div class="cb"><h3>'+CARDS[n-1]+'</h3><p>'+DESC[ix(n)]+'</p></div></div>'}
function miniHTML(n){if(PH())return pminiHTML(n);const [e,c]=ico(n);return '<div class="mini" style="--c:'+c+'" title="Card '+n+': '+CARDS[n-1]+'"><b>'+n+'</b><span>'+e+'</span></div>'}

const DRAIN=2,isQ=n=>PH()?PC[n-1].k==="Q":(n>=19&&n<=22);

var qrStream=null,qrTimer=0,qrDet=null;

async function qrStart(){

  let p="";try{const u=new URL(location.href);p=u.searchParams.get("c")||u.searchParams.get("card")||(/[#&]c=([A-Za-z0-9]+)/.exec(u.hash)||[])[1]||""}catch(e){}

  if(S.started&&S.mode==="phys"&&!S.over){showPlay();render();play(p)}
  else if(!S.started||S.over){S.pendingCard=p;S.pick="phys";S.setup=S.setup||{nt:1,sizes:[1,1]};$("startBtn").onclick()}  /* a card link starts a physical mission and shows the card */
  else{S.pendingCard=p;const m=document.createElement("p");m.textContent="Card "+PC[parseCode(p)-1].c+" scanned. Start a Physical board game mission and it will open.";m.style.cssText="font-weight:600;max-width:420px";$("titlescreen").insertBefore(m,$("startBtn"))}
})();
</script>
